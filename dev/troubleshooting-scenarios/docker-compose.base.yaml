---
# Single-node NiFi with TLS and Consul, based on .github/docker/tls/docker-compose.yaml without NiFi Registry.
# run.sh sets BASE_DIR (the .work directory), GIT_BASE_DIR, and the passwords in .work/docker.env.
# A scenario may add its own override file that changes the repository storage or the NiFi startup settings.
services:
  nifi-toolkit:
    image: apache/nifi-toolkit:1.28.1@sha256:7a43836dcc7ac37c5243dd11792da3aaff1b28a1c0e06b41c23cb16118c42652
    depends_on:
      consul:
        condition: service_healthy
    container_name: ts-nifi-toolkit
    entrypoint: /bin/bash
    command: /tmp/tls-scripts/nifi-gen-certs.sh
    volumes:
      - tls-cert:/tmp/tls-certs
      - tls-scripts:/tmp/tls-scripts
    environment:
      - KEYSTORE_PASSWORD_NIFI=${KEYSTORE_PASSWORD_NIFI}
      - KEYSTORE_PASSWORD_NIFI_REG=${KEYSTORE_PASSWORD_NIFI_REG}
      - TRUSTSTORE_PASSWORD=${TRUSTSTORE_PASSWORD}
      - CONSUL_ACL_ENABLED=true
      - CONSUL_HOSTNAME=consul
      - CONSUL_TOKEN=${CONSUL_TOKEN}
      - CONSUL_READ_TOKEN=${CONSUL_READ_TOKEN}
  nifi:
    image: ${NIFI_IMAGE:-ghcr.io/netcracker/qubership-nifi}:${NIFI_IMAGE_TAG:-latest}
    depends_on:
      nifi-toolkit:
        condition: service_completed_successfully
    volumes:
      - nifi-conf:/opt/nifi/nifi-current/persistent_conf
      - tls-cert-nifi:/tmp/tls-certs
    ports:
      - 127.0.0.1:8080:8080
    environment:
      - NAMESPACE=local
      - CONSUL_ENABLED=true
      - CONSUL_URL=consul:8500
      - NIFI_CONSUL_INT_FRAMEWORK=spring
      - AUTH=tls
      - NIFI_NEW_SENSITIVE_KEY=${NIFI_SENSITIVE_KEY}
      - NIFI_WEB_HTTPS_PORT=8080
      - KEYSTORE_PATH=/tmp/tls-certs/keystore.p12
      - KEYSTORE_TYPE=PKCS12
      - KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD_NIFI}
      - TRUSTSTORE_PATH=/tmp/tls-certs/truststore.p12
      - TRUSTSTORE_TYPE=PKCS12
      - TRUSTSTORE_PASSWORD=${TRUSTSTORE_PASSWORD}
      - INITIAL_ADMIN_IDENTITY=CN=admin, OU=NIFI
      - CONSUL_ACL_TOKEN=${CONSUL_TOKEN}
    container_name: ts-nifi
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --show-error --max-time 10
          --cert "/tmp/tls-certs/CN=admin_OU=NIFI.p12:$$(cat /tmp/tls-certs/CN=admin_OU=NIFI.password)"
          --cert-type P12 --cacert /tmp/tls-certs/nifi-cert.pem
          https://nifi:8080/nifi-api/controller/config > /dev/null
      interval: 5s
      timeout: 10s
      retries: 60
      start_period: 15s
    restart: unless-stopped
    hostname: nifi
  consul:
    image: hashicorp/consul:1.22@sha256:a230dcea0bb107bd7958a912d1429fb7f9d399637de7ffb814b34412b9e8c543
    container_name: ts-consul
    volumes:
      - consul-conf:/consul/config
    ports:
      - 127.0.0.1:8500:8500
    hostname: consul
    healthcheck:
      test:
        - "CMD-SHELL"
        - "wget -q -O - http://127.0.0.1:8500/v1/status/leader | grep -q ':'"
      start_period: 5s
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  tls-scripts:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${GIT_BASE_DIR}/.github/workflows/sh/
  tls-cert:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: $BASE_DIR/temp-vol/tls-cert/
  tls-cert-nifi:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: $BASE_DIR/temp-vol/tls-cert/nifi/
  nifi-conf:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: $BASE_DIR/temp-vol/nifi/per-conf/
  consul-conf:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${GIT_BASE_DIR}/.github/configuration/consul/
