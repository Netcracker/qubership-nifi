---
services:
  nifi-toolkit:
    image: apache/nifi-toolkit:1.28.1@sha256:7a43836dcc7ac37c5243dd11792da3aaff1b28a1c0e06b41c23cb16118c42652
    depends_on:
      consul:
        condition: service_healthy
    container_name: nifi-toolkit
    entrypoint: /bin/bash
    command: /tmp/tls-scripts/nifi-gen-certs.sh
    volumes:
      - tls-cert:/tmp/tls-certs
      - tls-scripts:/tmp/tls-scripts
    environment:
      - KEYSTORE_PASSWORD_NIFI=${KEYSTORE_PASSWORD_NIFI}
      - KEYSTORE_PASSWORD_NIFI_REG=${KEYSTORE_PASSWORD_NIFI_REG}
      - TRUSTSTORE_PASSWORD=${TRUSTSTORE_PASSWORD}
      - CONSUL_ACL_ENABLED=true
      - CONSUL_HOSTNAME=consul
      - CONSUL_TOKEN=${CONSUL_TOKEN}
      - CONSUL_READ_TOKEN=${CONSUL_READ_TOKEN}
  nifi:
    image: ${NIFI_IMAGE:-local-nifi}:${NIFI_IMAGE_TAG:-test}
    depends_on:
      nifi-toolkit:
        condition: service_completed_successfully
    volumes:
      - nifi-conf:/opt/nifi/nifi-current/persistent_conf
      - tls-cert-nifi:/tmp/tls-certs
    ports:
      - 127.0.0.1:8080:8080
    environment:
      - NAMESPACE=local
      - CONSUL_ENABLED=true
      - CONSUL_URL=consul:8500
      - NIFI_CONSUL_INT_FRAMEWORK=spring
      - AUTH=tls
      - NIFI_NEW_SENSITIVE_KEY=${NIFI_SENSITIVE_KEY}
      - NIFI_WEB_HTTPS_PORT=8080
      - KEYSTORE_PATH=/tmp/tls-certs/keystore.p12
      - KEYSTORE_TYPE=PKCS12
      - KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD_NIFI}
      - TRUSTSTORE_PATH=/tmp/tls-certs/truststore.p12
      - TRUSTSTORE_TYPE=PKCS12
      - TRUSTSTORE_PASSWORD=${TRUSTSTORE_PASSWORD}
      - INITIAL_ADMIN_IDENTITY=CN=admin, OU=NIFI
      - CONSUL_ACL_TOKEN=${CONSUL_TOKEN}
    container_name: local-nifi
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --show-error --max-time 10
          --cert "/tmp/tls-certs/CN=admin_OU=NIFI.p12:$$(cat /tmp/tls-certs/CN=admin_OU=NIFI.password)"
          --cert-type P12 --cacert /tmp/tls-certs/nifi-cert.pem
          https://nifi:8080/nifi-api/controller/config > /dev/null
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 15s
    restart: unless-stopped
    hostname: nifi
  nifi-registry:
    image: ghcr.io/netcracker/qubership-nifi-registry:latest
    depends_on:
      nifi-toolkit:
        condition: service_completed_successfully
    volumes:
      - tls-cert-reg:/tmp/tls-certs
    ports:
      - 127.0.0.1:18080:18080
    environment:
      - AUTH=tls
      - NIFI_REGISTRY_WEB_HTTPS_PORT=18080
      - NIFI_REGISTRY_WEB_HTTP_HOST=0.0.0.0
      - KEYSTORE_PATH=/tmp/tls-certs/keystore.p12
      - KEYSTORE_TYPE=PKCS12
      - KEYSTORE_PASSWORD=${KEYSTORE_PASSWORD_NIFI_REG}
      - TRUSTSTORE_PATH=/tmp/tls-certs/truststore.p12
      - TRUSTSTORE_TYPE=PKCS12
      - TRUSTSTORE_PASSWORD=${TRUSTSTORE_PASSWORD}
      - INITIAL_ADMIN_IDENTITY=CN=admin, OU=NIFI
      - NIFI_REGISTRY_CHECK_HOST=nifi-registry
    container_name: local-nifi-registry
    hostname: nifi-registry
    #Uncomment after fix for auth=TLS support in ready.sh is delivered:
    #healthcheck:
    #  test:
    #    - CMD
    #    - bash
    #    - /opt/nifi-registry/scripts/ready.sh
    #  interval: 5s
    #  timeout: 5s
    #  retries: 15
    #  start_period: 15s
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          curl --fail --silent --show-error --max-time 5
          --cert "/tmp/tls-certs/CN=admin_OU=NIFI.p12:$$(cat /tmp/tls-certs/CN=admin_OU=NIFI.password)"
          --cert-type P12 --cacert /tmp/tls-certs/nifi-cert.pem
          https://nifi-registry:18080/nifi-registry-api/config > /dev/null
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 5s
  consul:
    image: hashicorp/consul:1.20@sha256:200471c74bc0965cd20c81eacc31a209873d5d9e599fe637ceb856b0cbbc518d
    volumes:
      - consul-conf:/consul/config
    ports:
      - 127.0.0.1:8500:8500
    hostname: consul
    healthcheck:
      test:
        - "CMD-SHELL"
        - "wget -q -O - http://127.0.0.1:8500/v1/status/leader | grep -q ':'"
      start_period: 5s
      interval: 5s
      timeout: 3s
      retries: 12
volumes:
  tls-scripts:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${GIT_BASE_DIR:-$BASE_DIR}/.github/workflows/sh/
  tls-cert:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: $BASE_DIR/temp-vol/tls-cert/
  tls-cert-nifi:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: $BASE_DIR/temp-vol/tls-cert/nifi/
  tls-cert-reg:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: $BASE_DIR/temp-vol/tls-cert/nifi-registry/
  nifi-conf:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: $BASE_DIR/temp-vol/nifi/per-conf/
  consul-conf:
    driver: local
    driver_opts:
      o: bind
      type: none
      device: ${GIT_BASE_DIR:-$BASE_DIR}/.github/configuration/consul/
