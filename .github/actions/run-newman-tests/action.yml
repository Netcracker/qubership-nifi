---
name: 'Run newman tests'
description: 'Runs newman tests'
inputs:
  collection-name:
    description: 'Name of collection to run'
    required: false
    default: 'NiFi_Basic_API_Tests.postman_collection.json'
  short-name:
    description: 'Short name of collection to run'
    required: false
    default: 'basic'
  env-name:
    description: 'Environment name for newman run'
    required: false
    default: 'NiFi_AT_TLS.json.postman_environment'
  results-dir:
    description: 'Directory to store results'
    required: false
    default: 'tls'
  tls-certs-dir:
    description: |
      Path to local directory with TLS certificates in PEM format.
      Corresponds to newman option ssl-extra-ca-certs.
    required: false
    default: './temp-vol/tls-cert'
  tls-ca-certs:
    description: |
      Relative path (within directory specified in tls-certs-dir) to file with additional TLS CA certificates in PEM format.
      Corresponds to newman option ssl-extra-ca-certs.
    required: false
    default: ''
  tls-client-certs-config:
    description: |
      Relative path (within directory specified in tls-certs-dir)  to JSON file with TLS client certificates configuration.
      Corresponds to newman option ssl-client-cert-list.
    required: false
    default: ''
  global-vars-file-name:
    description: 'The name of the file in which global variables are specified'
    required: false
    default: ''
  docker-compose-file:
    description: 'Path to docker compose file'
    required: true
    default: ''
runs:
  using: "composite"
  steps:
    - name: Prepare output directory
      shell: bash
      run: |
        echo "Preparing output directory ${RESULTS_DIR}"
        mkdir -p "./test-results/${RESULTS_DIR}/"
      env:
        RESULTS_DIR: ${{ inputs.results-dir }}
    - name: Run newman tests
      shell: bash
      continue-on-error: true
      run: |
        . .github/workflows/sh/nifi-lib.sh
        gitDir="$(pwd)"
        collectionsDir="${gitDir}/.github/collections"
        echo "Running newman using collection ${COLLECTION_NAME} with env ${ENV_NAME} from $collectionsDir"
        caCertsFile="${TLS_CA_CERTS}"
        caCertsOption=''
        clientCertConfigFile="${TLS_CLIENT_CERTS_CONFIG}"
        clientCertConfigOption=''
        echo "Additional TLS options: caCertsFile = $caCertsFile, clientCertConfigFile = $clientCertConfigFile"
        if [ -n "$caCertsFile" ]; then
          caCertsOption="--ssl-extra-ca-certs \"/tmp/tls-certs/$caCertsFile\""
        else
          caCertsOption=''
        fi
        if [ -n "$clientCertConfigFile" ]; then
          clientCertConfigOption="--ssl-client-cert-list \"/tmp/tls-certs/$clientCertConfigFile\""
        fi
        additionalVolumes=''
        tlsCertsDir="${TLS_CERTS_DIR}"
        if [ -d "$tlsCertsDir" ]; then
          echo "TLS certificate directory found at $tlsCertsDir, adding volume mapped to /tmp/tls-certs"
          additionalVolumes="-v \"$tlsCertsDir:/tmp/tls-certs\""
        fi
        globalVarFiles="${GLOBAL_VARS_FILE_NAME}"
        if [ -n "$globalVarFiles" ]; then
          pathGlobalVarFiles="--globals \"$globalVarFiles\""
        else
          pathGlobalVarFiles=''
        fi
        composeFile="${DOCKER_COMPOSE_FILE}"
        eval docker run --net=host --rm -v "$collectionsDir:/etc/newman" \
          "$additionalVolumes" postman/newman:alpine run "${COLLECTION_NAME}" \
          --environment="${ENV_NAME}" -r cli,junit \
          "$caCertsOption" "$clientCertConfigOption" "$pathGlobalVarFiles" || \
          { echo "Collection ${SHORT_NAME} failed to run" > \
            "./test-results/${RESULTS_DIR}/failed_${SHORT_NAME}_at.lst"; \
            docker compose -f "$composeFile" --env-file ./docker.env logs > ./nifi_log_tmp.lst; \
            cp ./nifi_log_tmp.lst "./test-results/${RESULTS_DIR}/nifi_log_after_newman.log"; }
        summaryFileName=$(get_next_summary_file_name "${RESULTS_DIR}")
        if [ -f "./test-results/${RESULTS_DIR}/failed_${SHORT_NAME}_at.lst" ]; then
          # failed:
          echo "| Autotest collection ${SHORT_NAME}   | Failed :x:                 |" \
            >"./test-results/${RESULTS_DIR}/$summaryFileName"
        else
          # success
          echo "| Autotest collection ${SHORT_NAME}   | Success :white_check_mark: |" \
            >"./test-results/${RESULTS_DIR}/$summaryFileName"
        fi
      env:
        COLLECTION_NAME: ${{ inputs.collection-name }}
        SHORT_NAME: ${{ inputs.short-name }}
        ENV_NAME: ${{ inputs.env-name }}
        RESULTS_DIR: ${{ inputs.results-dir }}
        TLS_CERTS_DIR: ${{ inputs.tls-certs-dir }}
        TLS_CA_CERTS: ${{ inputs.tls-ca-certs }}
        TLS_CLIENT_CERTS_CONFIG: ${{ inputs.tls-client-certs-config }}
        GLOBAL_VARS_FILE_NAME: ${{ inputs.global-vars-file-name }}
        DOCKER_COMPOSE_FILE: ${{ inputs.docker-compose-file }}
    - name: Collect test results
      shell: bash
      continue-on-error: true
      run: |
        echo "Collecting collection results into ./test-results/${RESULTS_DIR}..."
        find .github/collections -name \*.xml -exec cp {} "./test-results/${RESULTS_DIR}/" \;
      env:
        RESULTS_DIR: ${{ inputs.results-dir }}
