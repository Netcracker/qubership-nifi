---
name: 'Run NiFi with incorrect configuration for consul'
description: 'Run NiFi with invalid consul token and test for proper error log messages'
inputs:
  run-mode:
    description: 'Autotest run mode.'
    required: false
    default: 'tls'
  error-mode:
    description: 'Error mode for start'
    required: false
    default: 'tls-consul-read'
runs:
  using: "composite"
  steps:
    - name: Prepare env
      shell: bash
      run: |
        echo "Preparing env..."
        . .github/workflows/sh/nifi-lib.sh
        setup_env_before_tests "${ERROR_MODE}"
      env:
        ERROR_MODE: ${{ inputs.error-mode }}
    - name: Start local NiFi before the Consul read error
      shell: bash
      if: ${{ inputs.error-mode == 'tls-consul-read' }}
      continue-on-error: true
      run: |
        . .github/workflows/sh/nifi-lib.sh
        export NIFI_SENSITIVE_KEY=$(cat ./nifi-sens-key.tmp)
        start_containers_and_wait ".github/docker/${RUN_MODE}/docker-compose.yaml" "${ERROR_MODE}" "180"
        echo "Change Consul ACL token for NiFi..."
        docker compose -f ".github/docker/${RUN_MODE}/docker-compose.yaml" --env-file ./docker.env rm -f nifi
        regenerate_consul_token
        docker compose -f ".github/docker/${RUN_MODE}/docker-compose.yaml" --env-file ./docker.env up -d
      env:
        RUN_MODE: ${{ inputs.run-mode }}
        ERROR_MODE: ${{ inputs.error-mode }}
    - name: Start local NiFi before the Consul write error
      shell: bash
      if: ${{ inputs.error-mode == 'tls-consul-write' }}
      continue-on-error: true
      run: |
        . .github/workflows/sh/nifi-lib.sh
        export NIFI_SENSITIVE_KEY=$(cat ./nifi-sens-key.tmp)
        start_containers_and_wait ".github/docker/${RUN_MODE}/docker-compose.yaml" "${ERROR_MODE}" "180"
      env:
        RUN_MODE: ${{ inputs.run-mode }}
        ERROR_MODE: ${{ inputs.error-mode }}
    - name: Set restore version for nifi configuration
      if: ${{ inputs.error-mode == 'tls-consul-write' }}
      shell: bash
      continue-on-error: true
      run: |
        . .github/workflows/sh/nifi-lib.sh
        get_flow_json_version ".github/docker/${RUN_MODE}/docker-compose.yaml"
        export CONF_VERSION=$(cat ./nifi-conf-version.tmp)
        [ -f ./consul-acl-token.tmp ] && CONSUL_TOKEN=$(cat ./consul-acl-token.tmp)
        set_configuration_version "$CONF_VERSION" "$CONSUL_TOKEN"
      env:
        RUN_MODE: ${{ inputs.run-mode }}
    - name: Restart nifi with read-only consul token
      if: ${{ inputs.error-mode == 'tls-consul-write' }}
      shell: bash
      continue-on-error: true
      run: |
        . .github/workflows/sh/nifi-lib.sh
        export NIFI_SENSITIVE_KEY=$(cat ./nifi-sens-key.tmp)
        echo "Restarting nifi and nifi-toolkit containers..."
        docker compose -f ".github/docker/${RUN_MODE}/docker-compose.yaml" --env-file ./docker.env rm -f nifi
        [ -f ./consul-acl-read-token.tmp ] && READ_CONSUL_TOKEN=$(cat ./consul-acl-read-token.tmp)
        sed -i "s/^CONSUL_TOKEN=.*$/CONSUL_TOKEN=$READ_CONSUL_TOKEN/" ./docker.env
        docker compose -f ".github/docker/${RUN_MODE}/docker-compose.yaml" --env-file ./docker.env up -d
      env:
        RUN_MODE: ${{ inputs.run-mode }}
    - name: Checking that local-nifi has not started
      shell: bash
      if: ${{ inputs.error-mode == 'tls-consul-read' }}
      continue-on-error: true
      run: |
        . .github/workflows/sh/nifi-lib.sh
        export NIFI_SENSITIVE_KEY=$(cat ./nifi-sens-key.tmp)
        check_container_not_started "ERROR: Consul app java process has terminated prematurely. See logs for details..." "local-nifi" ".github/docker/${RUN_MODE}/docker-compose.yaml" "${ERROR_MODE}"
      env:
        RUN_MODE: ${{ inputs.run-mode }}
        ERROR_MODE: ${{ inputs.error-mode }}
    - name: Checking that local-nifi has not started
      shell: bash
      if: ${{ inputs.error-mode == 'tls-consul-write' }}
      continue-on-error: true
      run: |
        . .github/workflows/sh/nifi-lib.sh
        export NIFI_SENSITIVE_KEY=$(cat ./nifi-sens-key.tmp)
        check_container_not_started "Removing the property 'nifi-restore-version' from the consul was not completed." "local-nifi" ".github/docker/${RUN_MODE}/docker-compose.yaml" "${ERROR_MODE}"
      env:
        RUN_MODE: ${{ inputs.run-mode }}
        ERROR_MODE: ${{ inputs.error-mode }}
    - name: Cleanup after tests
      shell: bash
      continue-on-error: true
      run: |
        export NIFI_SENSITIVE_KEY=$(cat ./nifi-sens-key.tmp)
        echo "Stopping and removing containers"
        docker compose -f ".github/docker/${RUN_MODE}/docker-compose.yaml" --env-file ./docker.env down -v
        sudo rm -rf ./temp-vol/
      env:
        RUN_MODE: ${{ inputs.run-mode }}
