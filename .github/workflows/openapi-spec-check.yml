---
# Lint the generated NiFi OpenAPI spec and detect breaking changes.
name: OpenAPI spec check
run-name: "Check the OpenAPI spec for ${{ github.ref_name }} (${{ github.event_name }})"

on:
  pull_request: {}
  push:
    branches:
      - main

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      relevant: ${{ steps.paths.outputs.relevant }}
    steps:
      - name: Check out the candidate and its parents
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Check the changed paths
        id: paths
        shell: bash
        run: |
          # The PR merge commit's first parent is the target commit. On main, it is the pushed commit's predecessor.
          baseline=$(git rev-parse HEAD^1)
          spec_changes=$(git diff --name-only "$baseline" HEAD -- docs/openapi/openapi.json)
          validator_changes=$(git diff --name-only "$baseline" HEAD -- \
            .github/workflows/openapi-spec-check.yml .github/workflows/python/ \
            .github/docker/apihub/docker-compose.yaml \
            docs/openapi/openapi-compatibility-exceptions.yml docs/openapi/openapi-lint-exceptions.yml)
          if [[ -n "$spec_changes" || -n "$validator_changes" ]]; then
            echo "relevant=true" >> "$GITHUB_OUTPUT"
          fi
          if [[ -z "$spec_changes" && -n "$validator_changes" ]]; then
            echo "OpenAPI spec unchanged. An OpenAPI check input changed, so the check runs on the current spec." >> "$GITHUB_STEP_SUMMARY"
          elif [[ -z "$spec_changes" ]]; then
            echo "OpenAPI spec unchanged." >> "$GITHUB_STEP_SUMMARY"
          fi

  openapi-check:
    name: OpenAPI lint and compatibility
    needs: [ changes ]
    if: needs.changes.outputs.relevant == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the candidate and its parents
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Select the OpenAPI specs
        shell: bash
        run: |
          spec=docs/openapi/openapi.json
          baseline=$(git rev-parse HEAD^1)
          work_dir="$RUNNER_TEMP/openapi-check"
          mkdir -p "$work_dir/reports"
          if ! git cat-file -e "HEAD:$spec"; then
            echo 'The candidate removes docs/openapi/openapi.json.' | tee "$work_dir/reports/spec-removal.txt"
            exit 1
          fi
          git show "HEAD:$spec" > "$work_dir/current.json"
          if git cat-file -e "$baseline:$spec" 2>/dev/null; then
            git show "$baseline:$spec" > "$work_dir/previous.json"
          fi

      - name: Validate the APIHUB Compose configuration
        run: docker compose -f .github/docker/apihub/docker-compose.yaml config --no-interpolate --quiet

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Install and test the validator
        run: |
          python3 -m pip install --require-hashes --only-binary=:all: -r .github/workflows/python/requirements-openapi.txt
          python3 -m pytest .github/workflows/python

      - name: Run APIHUB lint and compatibility checks
        id: validate
        shell: bash
        run: |
          work_dir="$RUNNER_TEMP/openapi-check"
          compose=(docker compose -f .github/docker/apihub/docker-compose.yaml)
          APIHUB_DB_PASSWORD=$(openssl rand -hex 24)
          APIHUB_ACCESS_TOKEN=$(openssl rand -hex 24)
          APIHUB_ADMIN_PASSWORD=$(openssl rand -hex 24)
          APIHUB_JWT_PRIVATE_KEY=$(openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:2048 | openssl base64 -A)
          export APIHUB_DB_PASSWORD APIHUB_ACCESS_TOKEN APIHUB_ADMIN_PASSWORD APIHUB_JWT_PRIVATE_KEY
          trap '"${compose[@]}" down --volumes' EXIT
          "${compose[@]}" up --detach --wait --wait-timeout 120
          python3 .github/workflows/python/check_openapi.py "$work_dir"

      - name: Upload OpenAPI reports
        if: >-
          ${{ !cancelled() &&
              (failure() || steps.validate.outputs.lint_findings == 'true' || steps.validate.outputs.breaking == 'true') }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openapi-reports
          path: ${{ runner.temp }}/openapi-check/reports/
          if-no-files-found: ignore

  ci-gate:
    name: OpenAPI CI Gate
    needs: [ changes, openapi-check ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail if the required checks did not pass
        if: >-
          ${{ cancelled() || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') ||
              (needs.changes.outputs.relevant == 'true' && contains(needs.*.result, 'skipped')) }}
        run: exit 1
