---
name: upgrade-advisor-test

on:
  push:
    # A push run on a pull request branch would report the same gate names as the pull request run,
    # and its result would stand in for the required check until the pull request run finishes.
    # release/** stays out because zizmor treats a push to such a branch as publishing and flags the caches.
    branches:
      - main
      - develop
      - 'support/**'
    paths:
      - 'dev/upgrade-advisor/**'
      - 'dev/upgrade-advisor-autotest/**'
      - 'dev-tools-integration-tests/**'
      - 'pom.xml'
      - '.github/workflows/upgrade-advisor-test.yml'
  pull_request: null
  workflow_dispatch: null

permissions:
  contents: read

jobs:
  # The path list lives here rather than under on.pull_request, so that the workflow always starts and the
  # gate job always reports the required check. A workflow that does not start leaves that check pending.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Check the changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            relevant:
              - 'dev/upgrade-advisor/**'
              - 'dev/upgrade-advisor-autotest/**'
              - 'dev-tools-integration-tests/**'
              - 'pom.xml'
              - '.github/workflows/upgrade-advisor-test.yml'

  upgrade-advisor-test:
    needs: [ changes ]
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      # The bash test case runs the advisor straight on the runner, so both tools must be present.
      # They ship with ubuntu-latest. UpgradeAdvisorBashIT fails on its own when one is missing;
      # this step just fails faster and records the versions, which matter when jq output changes.
      - name: Check advisor prerequisites
        run: |
          bash --version | head -1
          jq --version

      - name: Build upgrade advisor Docker image
        run: docker build -t qubership-nifi-upgrade-advisor:test . -f dev/upgrade-advisor-autotest/Dockerfile

      - name: Run upgrade advisor tests
        run: |
          mvn --batch-mode verify -pl dev-tools-integration-tests -P upgrade-advisor-tests \
            -DskipITs=false -DskipUnitTests=true -Dgpg.skip=true
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The suite fails on a missing prerequisite rather than skipping, but that cannot catch a
      # class that was never selected - a renamed class or a broken include pattern still leaves
      # the build green. Check the reports instead of trusting them.
      - name: Verify both advisor test classes ran
        run: |
          reports=dev-tools-integration-tests/target/failsafe-reports
          status=0
          for class in UpgradeAdvisorBashIT UpgradeAdvisorDockerIT; do
            report="$reports/TEST-org.qubership.nifi.dev.tools.$class.xml"
            if [ ! -f "$report" ]; then
              echo "::error::$class produced no failsafe report - the class did not run"
              status=1
              continue
            fi
            tests=$(grep -o 'tests="[0-9]*"' "$report" | head -1 | grep -o '[0-9]*')
            skipped=$(grep -o 'skipped="[0-9]*"' "$report" | head -1 | grep -o '[0-9]*')
            echo "$class: ${tests:-?} tests, ${skipped:-?} skipped"
            if [ "${tests:-0}" -eq 0 ] || [ "${skipped:-0}" -ne 0 ]; then
              echo "::error::$class ran ${tests:-0} tests and skipped ${skipped:-0}"
              status=1
            fi
          done
          exit $status

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upgrade-advisor-test-results
          path: dev-tools-integration-tests/target/failsafe-reports/
          retention-days: 2

  ci-gate:
    name: Upgrade Advisor CI Gate
    needs: [ changes, upgrade-advisor-test ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      # A guarded job that a cancellation stops before it starts reports skipped, so a skipped job on a relevant
      # pull request also fails the gate.
      - name: Fail if the tests did not run and pass
        if: >-
          ${{ cancelled() || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') ||
          (needs.changes.outputs.relevant == 'true' && contains(needs.*.result, 'skipped')) }}
        run: exit 1
