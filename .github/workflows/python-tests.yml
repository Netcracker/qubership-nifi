---
name: python-tests

on:
  push:
    paths:
      - 'agent-packages/adapt-nifi-flows-to-2-x/.apm/skills/adapt-nifi-flows-to-2-x/scripts/**'
      - 'agent-packages/adapt-nifi-flows-to-2-x/.apm/skills/adapt-nifi-flows-to-2-x/tests/**'
      - 'agent-packages/nifi-development-kit/.apm/skills/nifi-flow-builder/scripts/**'
      - 'agent-packages/nifi-development-kit/.apm/skills/nifi-flow-builder/tests/**'
      - 'agent-packages/qubership-nifi-lint-hook/.apm/hooks/**'
      - 'agent-packages/qubership-nifi-lint-hook-claude/.apm/hooks/**'
      - 'dev/api-usage-collector/**'
      - '.github/workflows/python-tests.yml'
  pull_request: null
  workflow_dispatch: null

permissions:
  contents: read

jobs:
  # The path list lives here rather than under on.pull_request, so that the workflow always starts and the
  # gate job always reports the required check. A workflow that does not start leaves that check pending.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Check the changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            relevant:
              - 'agent-packages/adapt-nifi-flows-to-2-x/.apm/skills/adapt-nifi-flows-to-2-x/scripts/**'
              - 'agent-packages/adapt-nifi-flows-to-2-x/.apm/skills/adapt-nifi-flows-to-2-x/tests/**'
              - 'agent-packages/nifi-development-kit/.apm/skills/nifi-flow-builder/scripts/**'
              - 'agent-packages/nifi-development-kit/.apm/skills/nifi-flow-builder/tests/**'
              - 'agent-packages/qubership-nifi-lint-hook/.apm/hooks/**'
              - 'agent-packages/qubership-nifi-lint-hook-claude/.apm/hooks/**'
              - 'dev/api-usage-collector/**'
              - '.github/workflows/python-tests.yml'

  python-test:
    needs: [ changes ]
    if: >-
      !cancelled() && needs.changes.result != 'failure' &&
      (github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python 3.12
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            agent-packages/adapt-nifi-flows-to-2-x/.apm/skills/adapt-nifi-flows-to-2-x/tests/requirements-test.txt
            agent-packages/nifi-development-kit/.apm/skills/nifi-flow-builder/tests/requirements-test.txt
            dev/api-usage-collector/tests/requirements-test.txt

      - name: Install dependencies
        run: python3 -m pip install --require-hashes -r agent-packages/adapt-nifi-flows-to-2-x/.apm/skills/adapt-nifi-flows-to-2-x/tests/requirements-test.txt

      - name: Run pytest
        run: python3 -m pytest agent-packages/adapt-nifi-flows-to-2-x/.apm/skills/adapt-nifi-flows-to-2-x/tests --junitxml=pytest-results-adapt-nifi-flows-to-2-x.xml

      - name: Install nifi-flow-builder dependencies
        if: ${{ !cancelled() }}
        run: python3 -m pip install --require-hashes -r agent-packages/nifi-development-kit/.apm/skills/nifi-flow-builder/tests/requirements-test.txt

      - name: Run nifi-flow-builder pytest
        if: ${{ !cancelled() }}
        run: python3 -m pytest agent-packages/nifi-development-kit/.apm/skills/nifi-flow-builder/tests --junitxml=pytest-results-nifi-flow-builder.xml

      - name: Install api-usage-collector dependencies
        if: ${{ !cancelled() }}
        run: python3 -m pip install --require-hashes -r dev/api-usage-collector/tests/requirements-test.txt

      - name: Run api-usage-collector pytest
        if: ${{ !cancelled() }}
        run: python3 -m pytest dev/api-usage-collector/tests --junitxml=pytest-results-api-usage-collector.xml

      - name: Check that the lint hook script copies are identical
        if: ${{ !cancelled() }}
        run: >-
          cmp agent-packages/qubership-nifi-lint-hook-claude/.apm/hooks/lint_changed_file.py
          agent-packages/qubership-nifi-lint-hook/.apm/hooks/lint_changed_file.py

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: python-test-results
          path: |
            pytest-results-adapt-nifi-flows-to-2-x.xml
            pytest-results-nifi-flow-builder.xml
            pytest-results-api-usage-collector.xml
          retention-days: 2

  ci-gate:
    name: Python CI Gate
    needs: [ changes, python-test ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Fail if any dependency failed or was cancelled
        if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
        run: exit 1
