---
name: docker-build-and-test

on:
  push:
    # A push run on a pull request branch would report the same gate names as the pull request run,
    # and its result would stand in for the required check until the pull request run finishes.
    # release/** stays out because zizmor treats a push to such a branch as publishing and flags the caches.
    branches:
      - main
      - develop
      - 'support/**'
    paths:
      - '.github/workflows/docker-build-and-test.yml'
      - '.github/workflows/maven-build.yaml'
      - 'qubership-bundle/**'
      - 'qubership-consul/**'
      - 'qubership-nifi-consul-common/**'
      - 'qubership-nifi-consul-templates/**'
      - 'qubership-nifi-quarkus-consul/**'
      - 'qubership-nifi-bulk-redis-service/**'
      - 'qubership-nifi-bundle-common/**'
      - 'qubership-nifi-common/**'
      - 'qubership-nifi-db-bundle/**'
      - 'qubership-nifi-lookup-services/**'
      - 'qubership-nifi-http-bundle/**'
      - 'qubership-services/**'
      - 'qubership-nifi-flow-analysis-rules/**'
      - 'qubership-test-bundle/**'
      - 'pom.xml'
      - 'Dockerfile'
      - 'nifi-config/**'
      - 'nifi-scripts/**'
      - 'qubership-nifi-deps/**'
      - 'scripts/**'
      - '.github/actions/**'
      - '.github/collections/**'
      - '.github/workflows/sh/**'
      - '.github/docker/**'
      - '.github/configuration/**'
  pull_request: null
  workflow_dispatch:
    inputs:
      java-version:
        required: false
        type: string
        default: "25"
        description: 'Java version (e.g., 25)'

permissions:
  contents: read

jobs:
  # The path list lives here rather than under on.pull_request, so that the workflow always starts and the
  # gate job always reports the required check. A workflow that does not start leaves that check pending.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Check the changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            relevant:
              - '.github/workflows/docker-build-and-test.yml'
              - '.github/workflows/maven-build.yaml'
              - 'qubership-bundle/**'
              - 'qubership-consul/**'
              - 'qubership-nifi-consul-common/**'
              - 'qubership-nifi-consul-templates/**'
              - 'qubership-nifi-quarkus-consul/**'
              - 'qubership-nifi-bulk-redis-service/**'
              - 'qubership-nifi-bundle-common/**'
              - 'qubership-nifi-common/**'
              - 'qubership-nifi-db-bundle/**'
              - 'qubership-nifi-lookup-services/**'
              - 'qubership-nifi-http-bundle/**'
              - 'qubership-services/**'
              - 'qubership-nifi-flow-analysis-rules/**'
              - 'qubership-test-bundle/**'
              - 'pom.xml'
              - 'Dockerfile'
              - 'nifi-config/**'
              - 'nifi-scripts/**'
              - 'qubership-nifi-deps/**'
              - 'scripts/**'
              - '.github/actions/**'
              - '.github/collections/**'
              - '.github/workflows/sh/**'
              - '.github/docker/**'
              - '.github/configuration/**'

  mvn:
    needs: [ changes ]
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true')
    # GitHub checks the permissions of a called job at startup, even when force-run skips that job, and a
    # called workflow cannot hold more permissions than its caller grants.
    permissions:
      contents: read
      pull-requests: read
    uses: ./.github/workflows/maven-build.yaml
    with:
      java-version: ${{ github.event.inputs.java-version || '25' }}
      artifact-id: 'qubership-nifi-local-build'
      upload-artifact: true
      skip-sonar: true
      skip-tools-it: true
      force-run: true
  docker-build-and-test:
    strategy:
      fail-fast: false
      matrix:
        run-mode:
        - 'tls'
        - 'tls-quarkus'
        - 'oidc'
        - 'oidc-quarkus'
        - 'oidc-cassandra'
        - 'oidc-kafka'
        - 'cluster'
        - 'cluster-statefulset'
        - 'cluster-statefulset-acl'
        - 'tls-consul-read'
        - 'tls-consul-write'
        - 'upgrade-oidc'
    needs: [ mvn ]
    # The default success() condition also checks indirect dependencies, and changes is skipped outside a pull request.
    if: ${{ !cancelled() && needs.mvn.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Prepare test results
        shell: bash
        run: |
          mkdir -p ./test-results/
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full git history is needed to get a proper list of changed files within `super-linter`
          fetch-depth: 0
          persist-credentials: false
      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: 'qubership-nifi-local-build'
      - name: Run local docker build
        run: docker build -t local-nifi:test .
      - name: Run test for consul = ${{ matrix.run-mode }}
        if: ${{ matrix.run-mode == 'tls-consul-read' || matrix.run-mode == 'tls-consul-write' }}
        uses: ./.github/actions/run-error-start-test
        with:
          run-mode: 'tls'
          error-mode: '${{ matrix.run-mode }}'
      - name: Run test for upgrade test = ${{ matrix.run-mode }}
        if: ${{ startsWith(matrix.run-mode, 'upgrade-') }}
        uses: ./.github/actions/run-upgrade-test
        with:
          run-mode: '${{ matrix.run-mode }}'
      - name: Run tests with mode = ${{ matrix.run-mode }}
        if: ${{ matrix.run-mode != 'tls-consul-read' && matrix.run-mode != 'tls-consul-write' && matrix.run-mode != 'upgrade-oidc' }}
        uses: ./.github/actions/run-nifi-tests-generic
        with:
          run-mode: '${{ matrix.run-mode }}'
      - name: Verify test results
        shell: bash
        run: |
          echo "Preparing summary..."
          {
            echo "## Autotests summary"
            echo "Run mode = ${{ matrix.run-mode }}"
            echo ""
            echo "| Step                                           | Result                     |"
            echo "| ---------------------------------------------- | -------------------------- |"
            cat ./test-results/*/summary_*.txt
            echo ""
          } >> $GITHUB_STEP_SUMMARY
          echo "Checking test results for failures..."
          failed_cnt=$(find ./test-results -name "failed_*.lst" | wc -l)
          echo "Found failed steps = $failed_cnt"
          if [ "$failed_cnt" == "0" ]; then
            echo "All tests were successful!"
            echo "All tests were successful!" >> $GITHUB_STEP_SUMMARY
          else
            echo "Some tests ($failed_cnt) failed. Marking as failure."
            echo "Some tests ($failed_cnt) failed. Marking as failure." >> $GITHUB_STEP_SUMMARY
            if [ -f ./docker.env ]; then
              if [ -d "./test-results/${{ matrix.run-mode }}" ]; then
                echo "Copying docker.env to test-results/${{ matrix.run-mode }}..."
                cp ./docker.env "./test-results/${{ matrix.run-mode }}/"
              fi
            fi
            exit 1;
          fi
      - name: Upload test results
        if: failure() || cancelled()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nifi-autotests-${{ matrix.run-mode }}-logs
          path: |
            ./test-results
          retention-days: 2

  ci-gate:
    name: Docker CI Gate
    needs: [ changes, mvn, docker-build-and-test ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      # A guarded job that a cancellation stops before it starts reports skipped, so a skipped job on a relevant
      # pull request also fails the gate.
      - name: Fail if the tests did not run and pass
        if: >-
          ${{ cancelled() || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') ||
          (needs.changes.outputs.relevant == 'true' && contains(needs.*.result, 'skipped')) }}
        run: exit 1
