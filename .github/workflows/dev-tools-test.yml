---
name: dev-tools-test

on:
  push:
    # A push run on a pull request branch would report the same gate names as the pull request run,
    # and its result would stand in for the required check until the pull request run finishes.
    # release/** stays out because zizmor treats a push to such a branch as publishing and flags the caches.
    branches:
      - main
      - develop
      - 'support/**'
    paths:
      - 'dev/update-scripts-2.0/**'
      - 'dev/update-scripts-prop-2.x/**'
      - 'dev/update-scripts-flow-2.x/**'
      - 'dev/update-scripts-ojdbc-location/**'
      - 'dev/update-scripts-autotest/**'
      - 'dev/flow-rules-script/**'
      - 'dev-tools-integration-tests/**'
      - 'pom.xml'
      - 'Dockerfile'
      - 'nifi-scripts/**'
      - 'nifi-config/**'
      - 'qubership-nifi-deps/**'
      - 'qubership-nifi-flow-analysis-rules/**'
      - '.github/workflows/sh/**'
      - '.github/workflows/dev-tools-test.yml'
      - '.github/docker/oidc/docker-compose.yaml'
      - '.github/configuration/keycloak/**'
  pull_request: null
  workflow_dispatch: null

permissions:
  contents: read

jobs:
  # The path list lives here rather than under on.pull_request, so that the workflow always starts and the
  # gate job always reports the required check. A workflow that does not start leaves that check pending.
  changes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Check the changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            relevant:
              - 'dev/update-scripts-2.0/**'
              - 'dev/update-scripts-prop-2.x/**'
              - 'dev/update-scripts-flow-2.x/**'
              - 'dev/update-scripts-ojdbc-location/**'
              - 'dev/update-scripts-autotest/**'
              - 'dev/flow-rules-script/**'
              - 'dev-tools-integration-tests/**'
              - 'pom.xml'
              - 'Dockerfile'
              - 'nifi-scripts/**'
              - 'nifi-config/**'
              - 'qubership-nifi-deps/**'
              - 'qubership-nifi-flow-analysis-rules/**'
              - '.github/workflows/sh/**'
              - '.github/workflows/dev-tools-test.yml'
              - '.github/docker/oidc/docker-compose.yaml'
              - '.github/configuration/keycloak/**'

  dev-tools-test:
    needs: [ changes ]
    if: >-
      !cancelled() &&
      (github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true')
    strategy:
      fail-fast: false
      matrix:
        nifi:
          # Apache NiFi 1.28.1; no flow analysis rules API before NiFi 2.0
          - { image: 'ghcr.io/netcracker/qubership-nifi', tag: '1.0.7', build-local: false,
              flow-rules: false }
          # Apache NiFi 2.5.0
          - { image: 'ghcr.io/netcracker/qubership-nifi', tag: '2.0.0', build-local: false,
              flow-rules: true }
          # Apache NiFi 2.6.0
          - { image: 'ghcr.io/netcracker/qubership-nifi', tag: '2.3.4', build-local: false,
              flow-rules: true }
          # Apache NiFi 2.7.2
          - { image: 'ghcr.io/netcracker/qubership-nifi', tag: '2.5.4', build-local: false,
              flow-rules: true }
          # Apache NiFi 2.9.0
          - { image: 'ghcr.io/netcracker/qubership-nifi', tag: '2.6.3', build-local: false,
              flow-rules: true }
          # Apache NiFi 2.10.0
          - { image: 'ghcr.io/netcracker/qubership-nifi', tag: '2.8.6', build-local: false,
              flow-rules: true }
          # Apache NiFi 2.12.0 (current), add more versions to this after upgrades
          - { image: 'local-nifi', tag: 'test', build-local: true, flow-rules: true }
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up JDK 25
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Build Maven artifacts (local image only)
        if: ${{ matrix.nifi.build-local }}
        run: mvn --batch-mode install -DskipUnitTests=true -Dgpg.skip=true
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Build local NiFi Docker image (local image only)
        if: ${{ matrix.nifi.build-local }}
        run: docker build -t local-nifi:test .

      - name: Build scripts Docker image
        run: docker build -t qubership-nifi-update-scripts:test . -f dev/update-scripts-autotest/Dockerfile

      - name: Set up test environment
        run: |
          . .github/workflows/sh/nifi-lib.sh
          setup_env_before_tests "oidc"
          echo "NIFI_IMAGE=${{ matrix.nifi.image }}" >> ./docker.env
          echo "NIFI_IMAGE_TAG=${{ matrix.nifi.tag }}" >> ./docker.env

      - name: Start NiFi environment and wait for health
        run: |
          NIFI_SENSITIVE_KEY=$(cat ./nifi-sens-key.tmp)
          export NIFI_SENSITIVE_KEY
          docker compose -f .github/docker/oidc/docker-compose.yaml --env-file ./docker.env \
            up -d --wait --wait-timeout 180

      - name: Determine compose network name
        id: network
        run: |
          NETWORK=$(docker network ls --filter "name=oidc_default" --format "{{.Name}}" | head -1)
          echo "name=$NETWORK" >> $GITHUB_OUTPUT

      - name: Run integration tests
        run: |
          NIFI_CLIENT_PASSWORD=$(cat ./temp-vol/tls-cert/nifi/CN=admin_OU=NIFI.password)
          export NIFI_CLIENT_PASSWORD
          WORKDIR=$(pwd)
          mvn verify -pl dev-tools-integration-tests -P update-scripts-tests \
            -DskipUnitTests=true -Dgpg.skip=true -DskipITs=false \
            "-Dnifi.cert.dir=$WORKDIR/temp-vol/tls-cert/nifi" \
            "-Dscripts.docker.network=$NETWORK_NAME"
        env:
          NETWORK_NAME: ${{ steps.network.outputs.name }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # The flow rules script runs on the runner, against the NiFi and the Consul this stack
      # already exposes on localhost, so this reuses what "Start NiFi environment and wait for health" brought up.
      - name: Run flow rules script tests
        if: ${{ matrix.nifi.flow-rules }}
        run: |
          NIFI_CLIENT_PASSWORD=$(cat ./temp-vol/tls-cert/nifi/CN=admin_OU=NIFI.password)
          export NIFI_CLIENT_PASSWORD
          WORKDIR=$(pwd)
          mvn verify -pl dev-tools-integration-tests -P flow-rules-tests \
            -DskipUnitTests=true -Dgpg.skip=true -DskipITs=false \
            "-Dnifi.cert.dir=$WORKDIR/temp-vol/tls-cert/nifi" \
            -Dconsul.url=http://localhost:8500
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Collect Docker logs on failure
        if: failure()
        run: |
          docker compose -f .github/docker/oidc/docker-compose.yaml --env-file ./docker.env \
            logs --no-color > ./nifi-docker.log 2>&1 || true

      - name: Upload test results and logs
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dev-tools-it-${{ matrix.nifi.tag }}-results
          path: |
            dev-tools-integration-tests/target/failsafe-reports/
            nifi-docker.log
          retention-days: 2

      - name: Cleanup
        if: always()
        run: |
          docker compose -f .github/docker/oidc/docker-compose.yaml --env-file ./docker.env \
            down -v || true
          sudo rm -rf ./temp-vol ./docker.env ./nifi-sens-key.tmp ./consul-acl-token.tmp \
            ./consul-acl-read-token.tmp ./consul-acl-write-token.tmp

  ci-gate:
    name: Dev Tools CI Gate
    needs: [ changes, dev-tools-test ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      # A guarded job that a cancellation stops before it starts reports skipped, so a skipped job on a relevant
      # pull request also fails the gate.
      - name: Fail if the tests did not run and pass
        if: >-
          ${{ cancelled() || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') ||
          (needs.changes.outputs.relevant == 'true' && contains(needs.*.result, 'skipped')) }}
        run: exit 1
