---
name: maven-build-and-test

on:
  push:
    # A push run on a pull request branch would report the same gate names as the pull request run,
    # and its result would stand in for the required check until the pull request run finishes.
    # release/** stays out because zizmor treats a push to such a branch as publishing and flags the caches.
    branches:
      - main
      - develop
      - 'support/**'
    paths:
      - '.github/workflows/maven-build.yaml'
      - 'docs/openapi/**'
      - 'docs/template/**'
      - 'docs/user-guide.md'
      - 'qubership-bundle/**'
      - 'qubership-consul/**'
      - 'qubership-nifi-bulk-redis-service/**'
      - 'qubership-nifi-bundle-common/**'
      - 'qubership-nifi-common/**'
      - 'qubership-nifi-db-bundle/**'
      - 'qubership-nifi-lookup-services/**'
      - 'qubership-nifi-http-bundle/**'
      - 'qubership-services/**'
      - 'qubership-nifi-flow-analysis-rules/**'
      - 'qubership-nifi-deps/**'
      - 'qubership-test-bundle/**'
      - 'dev-tools-integration-tests/**'
      - 'qubership-nifi-tools/**'
      - 'qubership-nifi-consul-common/**'
      - 'qubership-nifi-consul-templates/**'
      - 'qubership-nifi-quarkus-consul/**'
      - 'pom.xml'
  pull_request: null
  workflow_dispatch:
    inputs:
      java-version:
        required: false
        type: string
        default: "25"
        description: 'Java version (e.g., 25)'
      upload-artifact:
        required: false
        type: boolean
        default: false
        description: 'If set, uploads build results to action run'
      artifact-id:
        default: artifact
        required: false
        type: string
        description: 'Artifact name to use for artifact upload'
      skip-sonar:
        default: false
        required: false
        type: boolean
        description: 'If set, skips sonar cloud analysis'
      skip-tools-it:
        default: false
        required: false
        type: boolean
        description: 'If set, skips tools integration tests'
  workflow_call:
    inputs:
      java-version:
        required: false
        type: string
        default: "25"
      upload-artifact:
        required: false
        type: boolean
        default: false
      artifact-id:
        default: artifact
        required: false
        type: string
      skip-sonar:
        default: false
        required: false
        type: boolean
      skip-tools-it:
        default: false
        required: false
        type: boolean
      # A called workflow sees the event of its caller, so without this input the path list in the changes job would
      # skip the build that the caller needs on a pull request outside that list.
      force-run:
        default: false
        required: false
        type: boolean

permissions:
  contents: read

jobs:
  # The path list lives here rather than under on.pull_request, so that the workflow always starts and the
  # gate job always reports the required check. A workflow that does not start leaves that check pending.
  changes:
    if: github.event_name == 'pull_request' && !inputs.force-run
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: read
    outputs:
      relevant: ${{ steps.filter.outputs.relevant }}
    steps:
      - name: Check the changed paths
        id: filter
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            relevant:
              - '.github/workflows/maven-build.yaml'
              - 'docs/openapi/**'
              - 'docs/template/**'
              - 'docs/user-guide.md'
              - 'qubership-bundle/**'
              - 'qubership-consul/**'
              - 'qubership-nifi-bulk-redis-service/**'
              - 'qubership-nifi-bundle-common/**'
              - 'qubership-nifi-common/**'
              - 'qubership-nifi-db-bundle/**'
              - 'qubership-nifi-lookup-services/**'
              - 'qubership-nifi-http-bundle/**'
              - 'qubership-services/**'
              - 'qubership-nifi-flow-analysis-rules/**'
              - 'qubership-nifi-deps/**'
              - 'qubership-test-bundle/**'
              - 'dev-tools-integration-tests/**'
              - 'qubership-nifi-tools/**'
              - 'qubership-nifi-consul-common/**'
              - 'qubership-nifi-consul-templates/**'
              - 'qubership-nifi-quarkus-consul/**'
              - 'pom.xml'

  maven-build-and-test:
    needs: [ changes ]
    if: >-
      !cancelled() &&
      (inputs.force-run || github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Input parameters
        run: |
          echo "Java version: ${JAVA_VERSION}" >> $GITHUB_STEP_SUMMARY
        env:
          JAVA_VERSION: "${{ github.event.inputs.java-version || '25' }}"
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Full git history is needed to get a proper list of changed files within `super-linter`
          fetch-depth: 0
          persist-credentials: false
      - name: Cache Maven dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2
          # The key differs from the one in tools-integration-tests: that job skips unit tests, so its cache lacks
          # the artifacts that Quarkus resolves when it starts the Quarkus tests.
          key: ${{ runner.os }}-maven-build-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-build-
            ${{ runner.os }}-maven-
      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: ${{ inputs.java-version || '25' }}
          distribution: 'temurin'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      # --no-transfer-progress is required, not cosmetic. Quarkus test bootstrap reads the mvn options from
      # MAVEN_CMD_LINE_ARGS, and without this option it prints each artifact download. Surefire captures that output under a class loader lock that
      # Quarkus holds, so a download during test startup deadlocks the test JVM.
      - name: Run local maven build with sonar
        #skip if explicit skip is set or when SONAR_HOST_URL or SONAR_TOKEN are empty
        if: ${{ !inputs.skip-sonar && vars.SONAR_HOST_URL && env.SONAR_TOKEN }}
        run: >
          mvn --batch-mode --no-transfer-progress package
          -Dgpg.skip=true
          org.sonarsource.scanner.maven:sonar-maven-plugin:${SONAR_PLUGIN_VERSION}:sonar
          -Dsonar.projectKey=${SONAR_PROJECT_KEY} -Dsonar.organization=${SONAR_ORGANIZATION}
          -Dsonar.host.url=${SONAR_HOST_URL}
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_PLUGIN_VERSION: "${{ vars.SONAR_PLUGIN_VERSION }}"
          SONAR_ORGANIZATION: "${{ vars.SONAR_ORGANIZATION }}"
          SONAR_PROJECT_KEY: "${{ vars.SONAR_PROJECT_KEY }}"
          SONAR_HOST_URL: "${{ vars.SONAR_HOST_URL }}"
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Run local maven build w/o sonar
        #execute if explicit skip is set or when either SONAR_HOST_URL or SONAR_TOKEN are empty
        if: ${{ inputs.skip-sonar || !vars.SONAR_HOST_URL || !env.SONAR_TOKEN }}
        run: >
          mvn --batch-mode package --no-transfer-progress -Dgpg.skip=true
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload test results
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maven-unit-test-logs
          path: |
            **/target/surefire-reports/**/*.xml
          retention-days: 2
      - name: Upload all Maven target directories
        if: ${{ inputs.upload-artifact }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ inputs.artifact-id }}
          path: '**/target'
          retention-days: 1

  # Runs in parallel with maven-build-and-test to cut the wall-clock time of the workflow.
  tools-integration-tests:
    needs: [ changes ]
    if: >-
      !inputs.skip-tools-it && !cancelled() &&
      (inputs.force-run || github.event_name != 'pull_request' || needs.changes.outputs.relevant == 'true')
    permissions:
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Cache Maven dependencies
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.m2
          key: ${{ runner.os }}-maven-it-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-maven-it-
            ${{ runner.os }}-maven-
      - name: Set up JDK
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          java-version: ${{ inputs.java-version || '25' }}
          distribution: 'temurin'
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN
      - name: Run tools integration tests
        run: |
          # The integration tests need every module in the local repository, so install them first
          mvn --batch-mode install -DskipUnitTests=true -Dgpg.skip=true -Dmaven.javadoc.skip=true -Dmaven.source.skip=true -Dpmd.skip=true
          # Run integration tests with 2 threads:
          mvn --batch-mode verify -DskipUnitTests=true -Dgpg.skip=true -Dmaven.javadoc.skip=true -Dmaven.source.skip=true -Dpmd.skip=true -P tools-integration-tests -T2
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload test results
        if: failure() || cancelled()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: maven-integration-test-logs
          path: |
            **/target/surefire-reports/**/*.xml
            **/target/failsafe-reports/**/*.xml
            **/target/failsafe-reports/**/*.txt
          retention-days: 2

  ci-gate:
    name: Maven CI Gate
    needs: [ changes, maven-build-and-test, tools-integration-tests ]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      # A guarded job that a cancellation stops before it starts reports skipped, so a skipped job on a relevant
      # pull request also fails the gate.
      - name: Fail if the tests did not run and pass
        if: >-
          ${{ cancelled() || contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') ||
          (needs.changes.outputs.relevant == 'true' && contains(needs.*.result, 'skipped')) }}
        run: exit 1
